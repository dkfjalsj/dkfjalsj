<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080f"/>
      <stop offset="0.55" stop-color="#0a1626"/>
      <stop offset="1" stop-color="#06221f"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ef2d6"/>
      <stop offset="1" stop-color="#4aa8ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1d3a4a" stroke-width="0.6"/>
    </pattern>
    <radialGradient id="glow" cx="0.82" cy="0.4" r="0.45">
      <stop offset="0" stop-color="#1ad6b0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#1ad6b0" stop-opacity="0"/>
    </radialGradient>
    <style>
      .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
      .sans{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
      .blink{animation:b 1.2s steps(1) infinite}
      @keyframes b{50%{opacity:0}}
      .scan{animation:s 6s linear infinite}
      @keyframes s{from{transform:translateY(-40px)}to{transform:translateY(400px)}}
      .pulse{animation:p 2.4s ease-in-out infinite}
      @keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>
  <rect width="1200" height="360" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="14" fill="url(#grid)" opacity="0.55"/>
  <rect width="1200" height="360" rx="14" fill="url(#glow)"/>
  <rect class="scan" x="0" y="0" width="1200" height="2" fill="#5ef2d6" opacity="0.18"/>

  <!-- corner frames -->
  <g stroke="#5ef2d6" stroke-width="2" fill="none" opacity="0.8">
    <path d="M24 60V24H60"/><path d="M1140 24H1176V60"/>
    <path d="M24 300V336H60"/><path d="M1176 300V336H1140"/>
  </g>

  <text x="72" y="92" class="mono" font-size="15" letter-spacing="4" fill="#5ef2d6">// AI SERVICE · BACKEND DEVELOPER</text>
  <text x="68" y="180" class="sans" font-size="84" font-weight="800" letter-spacing="2" fill="url(#title)">KIM SUHYUN</text>
  <text x="72" y="222" class="mono" font-size="19" letter-spacing="3" fill="#e8f1f8">VERIFY THE AI. SHIP THE SERVICE.</text>

  <!-- chips -->
  <g class="mono" font-size="13" fill="#bfe9f2">
    <rect x="72" y="252" width="104" height="30" rx="15" fill="none" stroke="#2f6f80"/><text x="124" y="272" text-anchor="middle">LangGraph</text>
    <rect x="186" y="252" width="62" height="30" rx="15" fill="none" stroke="#2f6f80"/><text x="217" y="272" text-anchor="middle">LLM</text>
    <rect x="258" y="252" width="62" height="30" rx="15" fill="none" stroke="#2f6f80"/><text x="289" y="272" text-anchor="middle">RAG</text>
    <rect x="330" y="252" width="124" height="30" rx="15" fill="none" stroke="#2f6f80"/><text x="392" y="272" text-anchor="middle">Spring Boot</text>
    <rect x="464" y="252" width="90" height="30" rx="15" fill="none" stroke="#2f6f80"/><text x="509" y="272" text-anchor="middle">FastAPI</text>
    <rect x="564" y="252" width="84" height="30" rx="15" fill="none" stroke="#2f6f80"/><text x="606" y="272" text-anchor="middle">ML · DL</text>
    <rect x="658" y="252" width="84" height="30" rx="15" fill="none" stroke="#2f6f80"/><text x="700" y="272" text-anchor="middle">CI / CD</text>
  </g>

  <!-- status panel -->
  <g transform="translate(838 214)">
    <rect width="296" height="92" rx="8" fill="#071a1f" fill-opacity="0.75" stroke="#2f6f80"/>
    <circle class="pulse" cx="22" cy="26" r="5" fill="#5ef2d6"/>
    <text x="36" y="31" class="mono" font-size="13" letter-spacing="2" fill="#5ef2d6">SYSTEM ONLINE</text>
    <text x="276" y="31" class="mono" font-size="12" text-anchor="end" fill="#ff5a7a">KR</text>
    <text x="20" y="58" class="mono" font-size="12.5" letter-spacing="1.5" fill="#cfe3ec">MEASURE // VERIFY // DEPLOY</text>
    <text x="20" y="78" class="mono" font-size="12" fill="#7fa6b5">semiconductor QC → AI engineer<tspan class="blink" fill="#5ef2d6"> _</tspan></text>
  </g>

  <!-- node network accent -->
  <g stroke="#1ad6b0" stroke-opacity="0.35" stroke-width="1">
    <line x1="900" y1="70" x2="980" y2="120"/><line x1="980" y1="120" x2="1060" y2="80"/>
    <line x1="980" y1="120" x2="1010" y2="180"/><line x1="1060" y1="80" x2="1120" y2="140"/>
    <line x1="1010" y1="180" x2="1120" y2="140"/><line x1="900" y1="70" x2="940" y2="170"/>
    <line x1="940" y1="170" x2="1010" y2="180"/>
  </g>
  <g fill="#5ef2d6">
    <circle cx="900" cy="70" r="3.5"/><circle class="pulse" cx="980" cy="120" r="5"/>
    <circle cx="1060" cy="80" r="3.5"/><circle cx="1010" cy="180" r="3.5"/>
    <circle class="pulse" cx="1120" cy="140" r="4"/><circle cx="940" cy="170" r="3"/>
  </g>
</svg>
