<svg xmlns="http://www.w3.org/2000/svg" width="900" height="416" viewBox="0 0 900 416"><defs><style>.m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}.s{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}.draw{stroke-dasharray:3000;stroke-dashoffset:3000;animation:d 3.2s ease-out forwards}@keyframes d{to{stroke-dashoffset:0}}.blink{animation:b 1.4s steps(1) infinite}@keyframes b{50%{opacity:0}}.spin{transform-box:fill-box;transform-origin:center;animation:r 2s linear infinite}@keyframes r{to{transform:rotate(360deg)}}.k{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Noto Sans CJK KR',sans-serif}</style></defs><rect x="1" y="1" width="898" height="414" rx="10" fill="#f6f4ee" stroke="#d9d5c9" stroke-width="2"/><text x="28" y="46" class="m" font-size="17" font-weight="700" letter-spacing="2.5" fill="#1f2328">INSPECTOR NOTES</text><text x="872" y="46" class="m" font-size="14" text-anchor="end" fill="#5f636a">ABOUT ME</text><line x1="28" y1="64" x2="872" y2="64" stroke="#1f2328" stroke-width="1.5"/><text x="28" y="104" class="k" font-size="22" font-weight="700" fill="#1f2328">AI 결과를 검증하고, 실패에 대비해 서비스로 만드는 개발자</text><text x="28" y="150" class="m" font-size="15" font-weight="700" fill="#2b59c3">01</text><text x="66" y="150" class="k" font-size="17" fill="#1f2328">반도체 장비 회사에서 Wafer tester 보드 불량을 측정 데이터로 진단하고,</text><text x="66" y="176" class="k" font-size="17" fill="#1f2328">Linux 장비의 반복 작업을 Python 도구로 줄이며 개발을 시작했습니다.</text><text x="28" y="220" class="m" font-size="15" font-weight="700" fill="#2b59c3">02</text><text x="66" y="220" class="k" font-size="17" fill="#1f2328">LLM 문서 처리 웹앱, 드리프트를 감지·재학습하는 ML 시스템,</text><text x="66" y="246" class="k" font-size="17" fill="#1f2328">CNN 결함 분류 모델을 직접 만들어 배포했습니다.</text><text x="28" y="290" class="m" font-size="15" font-weight="700" fill="#2b59c3">03</text><text x="66" y="290" class="k" font-size="17" fill="#1f2328">팀 프로젝트에서 Spring Boot 백엔드·보안과 React 화면을 맡았고,</text><text x="66" y="316" class="k" font-size="17" fill="#1f2328">지금은 LangGraph 에이전트를 개발하고 있습니다.</text><text x="28" y="360" class="m" font-size="15" font-weight="700" fill="#2b59c3">04</text><text x="66" y="360" class="k" font-size="17" fill="#1f2328">모델이 좋아 보일 때 평가 방식부터 의심하고,</text><text x="66" y="386" class="k" font-size="17" fill="#1f2328">AI가 실패해도 사용자 데이터는 지키는 구조를 먼저 설계합니다.</text></svg>